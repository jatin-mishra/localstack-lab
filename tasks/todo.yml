plan_2_review: |
  All 5 containers (localstack, postgres, redis, elasticsearch, kibana) up and healthy.
  `make smoke-test` fully green: all pre-existing assertions plus 7 new ones
  (ES cluster health, index exists, seed doc count, match query, BM25 relevance
  ordering, missing-doc 404, Kibana api_status). Verified beyond the smoke test:
  reseed idempotency (seed script run twice, doc count unchanged at 9 = 8 seeded
  + 1 custom probe), restart persistence (custom doc survived `make down && make up`
  via esdata volume; seed script correctly skipped index creation on restart),
  Kibana connected to ES credential-less with security disabled. One transient
  smoke failure observed on the very first run (sqs_standard send_receive) - the
  already-documented Lambda-poller-consumes-test-message race, passed on immediate
  re-run, unrelated to this change. Probe doc deleted afterward; lab left in the
  documented 8-doc seeded state. NOTE: ES_PORT/KIBANA_PORT are optional .env keys;
  compose falls back to 9200/5601 defaults, so nothing to add unless overriding.
