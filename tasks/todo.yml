review: |
  All 3 containers (localstack, postgres, redis) up and healthy. All test cases in
  metric/test_cases_and_metrics.yml pass via `make smoke-test`, including corner cases:
  IAM implicit-deny (verified statically, see lessons), S3 versioning, DynamoDB
  conditional-write failure, SQS FIFO ordering + dedup, SQS DLQ redrive (verified
  manually), Lambda direct invoke + SQS-triggered invoke, CloudWatch log group + alarm
  definition, Postgres seeded joins, Redis TTL expiry.

  Restart-persistence verified with real data (not just assumption): DynamoDB, CloudWatch,
  and Postgres survive `make down && make up` correctly. S3 objects do NOT survive restart
  on this LocalStack build (confirmed via clean stop test, not a timing fluke) - documented
  as a known limitation in README Troubleshooting and metric/test_cases_and_metrics.yml notes.

  Three implementation bugs found and fixed during verification (not LocalStack's fault):
  smoke_test.sh originally used a v2-only CLI flag against the container's v1 CLI, used a
  bad receive-without-delete loop that ignored real FIFO group-blocking semantics, and used
  static per-run message bodies that collided with FIFO content-based dedup on repeated runs.
  Two LocalStack Community limitations found and worked around: iam simulate-principal-policy
  throws an internal error (replaced with a static policy-document assertion), and the latest
  image requires a free LOCALSTACK_AUTH_TOKEN to start at all now.

review_of_note: >
  Rare flake observed: back-to-back smoke-test runs with near-zero gap failed once out of
  three attempts (likely async processing lag settling from the prior run). Not reproducible
  with even a few seconds between runs — documented, not engineered around further.

